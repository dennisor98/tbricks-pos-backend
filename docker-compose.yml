services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: pos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: pos_system
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
    ports:
      - "3306:3307"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pos-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  # Spring Boot Application Instance 1
  pos-app-1:
    image: eclipse-temurin:17-jre-alpine
    container_name: pos-app-1
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pos_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: pos_user
      SPRING_DATASOURCE_PASSWORD: pos_password
      SERVER_PORT: 8080
      APP_INSTANCE_ID: 1
      JWT_SECRET: mySecretKey123456789012345678901234567890
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pos-network
    volumes:
      - ./target/classes:/app/classes:ro
      - ./src/main/resources:/app/resources:ro
    working_dir: /app
    command: ["java", "-cp", "/app/classes:/app/resources", "com.pos.PosSystemApplication"]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 60s



  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: pos-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pos-app-1
#      - pos-app-2
#      - pos-app-3
#      - pos-app-4
#      - pos-app-5
#      - pos-app-6
#      - pos-app-7
#      - pos-app-8
    networks:
      - pos-network

volumes:
  mysql_data:
    driver: local

networks:
  pos-network:
    driver: bridge